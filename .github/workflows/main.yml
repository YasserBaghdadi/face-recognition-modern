name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install (no compiler, no cmake)
      run: |
        python -m pip install --upgrade pip
        pip install . pytest
    - name: Import works without pkg_resources
      run: python -c "import sys; sys.modules['pkg_resources'] = None; import face_recognition; print(face_recognition.__version__)"
    - name: Test
      run: python -m pytest -q tests
